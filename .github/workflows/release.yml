name: Release

on:
  push:
    tags:
      - 'v0.0.*'
      - 'v0.0.*-*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Semver beta tag without v prefix (e.g. 0.0.2-beta)'
        required: true
        default: '0.0.1-beta'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: release-pages
  cancel-in-progress: false

jobs:
  build-linux:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Resolve release version
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
            TAG="v${VERSION}"
          else
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Release version: ${VERSION} (${TAG})"

      - name: Sync package.json version
        run: npm version "${{ steps.meta.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Install dependencies
        run: npm ci

      - name: Build Linux installers
        run: npm run dist:linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-installers
          path: |
            dist/*.deb
            dist/*.AppImage
          if-no-files-found: error

  github-release:
    needs: build-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: linux-installers
          path: dist

      - name: Create GitHub pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build-linux.outputs.tag }}
          name: Atop Viewer ${{ needs.build-linux.outputs.version }}
          prerelease: true
          generate_release_notes: true
          files: |
            dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-pages:
    needs: [build-linux, github-release]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: linux-installers
          path: dist

      - name: Write download manifest
        run: |
          VERSION="${{ needs.build-linux.outputs.version }}"
          TAG="${{ needs.build-linux.outputs.tag }}"
          REPO="${{ github.repository }}"
          BASE="https://github.com/${REPO}/releases/download/${TAG}"
          DEB=$(basename dist/*.deb)
          APPIMAGE=$(basename dist/*.AppImage)
          cat > docs/downloads.json <<EOF
          {
            "version": "${VERSION}",
            "tag": "${TAG}",
            "releasedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "prerelease": true,
            "repository": "${REPO}",
            "assets": {
              "deb": {
                "file": "${DEB}",
                "url": "${BASE}/${DEB}",
                "label": "Debian/Ubuntu (.deb)"
              },
              "appimage": {
                "file": "${APPIMAGE}",
                "url": "${BASE}/${APPIMAGE}",
                "label": "AppImage (portable Linux)"
              }
            },
            "releasePage": "https://github.com/${REPO}/releases/tag/${TAG}"
          }
          EOF

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@v4
