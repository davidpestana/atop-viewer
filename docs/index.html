<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Atop Viewer — Linux atop log analyzer (desktop app)</title>
    <meta
      name="description"
      content="Atop Viewer — desktop GUI for Linux atop historical logs. Atop log analyzer and visualizer. Requires atop installed. Download .deb or AppImage."
    />
    <meta
      name="keywords"
      content="atop viewer, atop log analyzer, atop visualizer, atop gui, linux performance monitoring, electron, devops, sre, sysadmin"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="page">
      <nav class="lang-switch" aria-label="Language">
        <button type="button" data-locale="en" aria-pressed="false">EN</button>
        <button type="button" data-locale="es" aria-pressed="false">ES</button>
      </nav>

      <header class="hero">
        <p id="badge" class="badge">Beta · Linux desktop · MIT</p>
        <h1>Atop Viewer</h1>
        <p id="tagline" class="tagline"></p>
        <p id="lead" class="lead"></p>
        <p id="version-line" class="version">Loading version…</p>
      </header>

      <figure class="demo">
        <img id="demo-img" src="assets/demo.gif" alt="" width="960" height="540" loading="lazy" />
        <figcaption id="demo-caption"></figcaption>
      </figure>

      <section class="card">
        <h2 id="features-title">Features</h2>
        <ul id="features-list" class="feature-list"></ul>
      </section>

      <section class="card">
        <h2 id="how-title">How it works</h2>
        <pre id="how-code" class="code-block"><code></code></pre>
        <p id="how-note" class="hint"></p>
      </section>

      <section class="card">
        <h2 id="download-title">Download</h2>
        <p id="download-hint" class="hint"></p>
        <div id="downloads" class="downloads">
          <p id="downloads-loading">Loading installers…</p>
        </div>
        <p class="meta">
          <span id="also-on">Also on</span>
          <a id="release-link" href="https://github.com/davidpestana/atop-viewer/releases"
            >GitHub Releases</a
          > ·
          <a id="readme-link" href="https://github.com/davidpestana/atop-viewer#readme">README</a>
        </p>
      </section>

      <section class="card">
        <h2 id="install-deb-title">Install on Ubuntu / Debian</h2>
        <pre id="install-deb-code" class="code-block"><code></code></pre>
        <p id="install-deb-note" class="hint"></p>
      </section>

      <section class="card">
        <h2 id="install-appimage-title">Other Linux distributions</h2>
        <pre id="install-appimage-code" class="code-block"><code></code></pre>
        <p id="install-appimage-note" class="hint"></p>
      </section>

      <section class="card">
        <h2 id="limits-title">Limitations</h2>
        <ul id="limits-list" class="feature-list"></ul>
      </section>

      <section class="card">
        <h2 id="roadmap-title">Roadmap</h2>
        <ul id="roadmap-list" class="feature-list roadmap"></ul>
      </section>

      <footer class="footer">
        <p id="license-line">
          License
          <a href="https://github.com/davidpestana/atop-viewer/blob/master/LICENSE">MIT</a>.
        </p>
      </footer>
    </main>
    <script src="i18n.js"></script>
    <script src="site.js"></script>
  </body>
</html>
