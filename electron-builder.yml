appId: com.davidpestana.atop-viewer
productName: Atop Viewer
copyright: Copyright © 2026 davidpestana

directories:
  output: dist
  buildResources: build

files:
  - out/**/*
  - package.json

asar: true

afterPack: scripts/after-pack.cjs

linux:
  target:
    - deb
    - AppImage
  category: System
  maintainer: davidpestana <davidpestana@users.noreply.github.com>
  executableName: atop-viewer
  executableArgs:
    - --no-sandbox
    - --ozone-platform=x11
  synopsis: Graphical explorer for Linux atop performance logs
  description: Visualize atop daily logs with system charts, live sampling, process timelines, and filters. Requires atop on the system.
  artifactName: atop-viewer-${version}-${arch}.${ext}

deb:
  depends:
    - atop
    - libgtk-3-0 | libgtk-3-0t64
    - libnss3
    - libxss1
    - libxtst6
    - libatk1.0-0 | libatk1.0-0t64
    - libatspi2.0-0 | libatspi2.0-0t64
    - libdrm2
    - libgbm1
    - libasound2 | libasound2t64
    - xdg-utils
  afterInstall: build/after-install.sh

publish: null
